name: Google Scholar Citations (optional)

on:
  workflow_dispatch:

# Disabled by default: the homepage has no verified Google Scholar ID yet.
# Add GOOGLE_SCHOLAR_ID as an Actions secret before running manually.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Google Scholar ID
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          if [ -z "$GOOGLE_SCHOLAR_ID" ]; then
            echo 'Set GOOGLE_SCHOLAR_ID under Settings > Secrets and variables > Actions first.'
            exit 1
          fi
      - name: Update citation data
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd google_scholar_crawler
          pip3 install -r requirements.txt
          python3 main.py
          cd results
          git init
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add *.json
          git commit -m 'Update citation data'
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats
